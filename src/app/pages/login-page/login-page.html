<div class="login-container">
    <div class="login-card">
    <div class="login-header">
        <h2>Bienvenido de nuevo</h2>
        <p>Inicia sesión en tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <div class="input-wrapper">
           <input 
            id="username" 
            type="text" 
            formControlName="username" 
            placeholder="Introduce tu usuario"
            autocomplete="username"
            [class.invalid]="loginForm.controls.username.invalid && loginForm.controls.username.touched"
          />
        </div>
        @if(loginForm.controls.username.invalid && loginForm.controls.username.touched) {
          <span class="error-message">El nombre de usuario es obligatorio</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="Introduce tu contraseña"
            autocomplete="current-password"
            [class.invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
          />
        </div>
        @if(loginForm.controls.password.invalid && loginForm.controls.password.touched) {
          <span class="error-message">La contraseña es obligatoria</span>
        }
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="loginForm.invalid" class="submit-button">
          Iniciar Sesión
        </button>
      </div>
    </form>
  </div>
</div>
